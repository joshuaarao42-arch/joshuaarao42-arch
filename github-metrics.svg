<svg xmlns="http://www.w3.org/2000/svg" width="900" height="190" viewBox="0 0 900 190" role="img" aria-label="GitHub profile statistics">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101B35"/><stop offset="1" stop-color="#070B16"/></linearGradient></defs>
<rect width="100%" height="100%" rx="18" fill="url(#bg)" stroke="#243653"/>
<style>text{font-family:Arial,Helvetica,sans-serif}.muted{fill:#94A3B8}.bright{fill:#EAF6FF}.accent{fill:#00D4FF}</style>
<text x="32" y="42" class="bright" font-size="20" font-weight="700">GITHUB OVERVIEW</text>
<text x="32" y="64" class="muted" font-size="11">Live public profile data · refreshed automatically</text>
<rect x="32" y="88" width="198" height="76" rx="12" fill="#0B1427" stroke="#263B5A"/>
<text x="48" y="116" class="muted" font-size="10" letter-spacing="1">PUBLIC REPOSITORIES</text>
<text x="48" y="148" class="accent" font-size="27" font-weight="700">16</text>
<rect x="250" y="88" width="198" height="76" rx="12" fill="#0B1427" stroke="#263B5A"/>
<text x="266" y="116" class="muted" font-size="10" letter-spacing="1">FOLLOWERS</text>
<text x="266" y="148" class="accent" font-size="27" font-weight="700">7</text>
<rect x="468" y="88" width="198" height="76" rx="12" fill="#0B1427" stroke="#263B5A"/>
<text x="484" y="116" class="muted" font-size="10" letter-spacing="1">STARS EARNED</text>
<text x="484" y="148" class="accent" font-size="27" font-weight="700">33</text>
<rect x="686" y="88" width="198" height="76" rx="12" fill="#0B1427" stroke="#263B5A"/>
<text x="702" y="116" class="muted" font-size="10" letter-spacing="1">FORKS</text>
<text x="702" y="148" class="accent" font-size="27" font-weight="700">0</text>
</svg>