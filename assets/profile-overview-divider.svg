<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="42" viewBox="0 0 1200 42" role="img" aria-label="Subtle neon gradient divider">
  <defs>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="#00d4ff" stop-opacity="0"/>
      <stop offset=".28" stop-color="#00d4ff" stop-opacity=".7"/>
      <stop offset=".5" stop-color="#b58cff" stop-opacity=".95"/>
      <stop offset=".72" stop-color="#ff3c9d" stop-opacity=".7"/>
      <stop offset="1" stop-color="#ff3c9d" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-200%" width="140%" height="500%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
  </defs>
  <path d="M70 21H1130" stroke="url(#fade)" stroke-width="5" opacity=".32" filter="url(#softGlow)"/>
  <path d="M70 21H1130" stroke="url(#fade)" stroke-width="1.4"/>
  <circle cx="600" cy="21" r="3" fill="#eafaff">
    <animate attributeName="opacity" values=".55;1;.55" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="21" r="7" fill="none" stroke="#8cecff" stroke-opacity=".35">
    <animate attributeName="r" values="5;8;5" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".25;.65;.25" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>