<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Joshua Arao — Animated glitch profile banner</title>
<desc id="desc">A futuristic animated banner with large glitching typography, moving neon grid, scanlines, pulsing particles and light streaks.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#030711"/><stop offset=".5" stop-color="#10152d"/><stop offset="1" stop-color="#070b19"/></linearGradient>
  <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#00e5ff" stop-opacity="0"/><stop offset=".5" stop-color="#00e5ff"/><stop offset="1" stop-color="#b44cff" stop-opacity="0"/></linearGradient>
  <radialGradient id="pulse"><stop stop-color="#00d9ff" stop-opacity=".22"/><stop offset="1" stop-color="#00d9ff" stop-opacity="0"/></radialGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="titleClip"><rect x="55" y="90" width="1090" height="155"/></clipPath>
  <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#17405b" stroke-width="1" opacity=".5"/></pattern>
  <style>
    text{font-family:'Arial Black',Impact,Arial,sans-serif;font-weight:900}
    .main{font-size:116px;letter-spacing:6px;fill:#f0faff}
    .cyan{fill:#00e5ff;opacity:.85;animation:shiftA 2.4s infinite steps(2,end)}
    .pink{fill:#ff3b9d;opacity:.72;animation:shiftB 2.1s infinite steps(2,end)}
    .mainText{animation:flicker 3.7s infinite}
    .sub,.micro{font-family:monospace;font-weight:700;letter-spacing:4px;animation:allTextGlitch 3.1s infinite}
    .sub{font-size:21px;fill:#d0e7f7}
    .micro{font-size:12px;fill:#00e5ff}
    .tiny{font-family:monospace;font-size:10px;letter-spacing:2px;fill:#a58cff;animation:flicker 2.2s infinite}
    @keyframes shiftA{0%,88%,100%{transform:translate(0,0)}90%{transform:translate(9px,-3px)}93%{transform:translate(-6px,2px)}96%{transform:translate(3px,0)}}
    @keyframes shiftB{0%,86%,100%{transform:translate(0,0)}89%{transform:translate(-10px,2px)}92%{transform:translate(6px,-2px)}95%{transform:translate(-3px,0)}}
    @keyframes flicker{0%,18%,20%,53%,55%,100%{opacity:1}19%,54%{opacity:.55}91%{opacity:.9}93%{opacity:.35}95%{opacity:1}}
    @keyframes allTextGlitch{0%,90%,100%{transform:translate(0,0);opacity:1}92%{transform:translate(3px,-1px);opacity:.65}94%{transform:translate(-4px,1px);opacity:1}96%{transform:translate(1px,0)}}
    @keyframes scan{0%{transform:translateY(-440px)}100%{transform:translateY(440px)}}
    @keyframes drift{from{transform:translateX(-90px)}to{transform:translateX(90px)}}
    @keyframes pulse{0%,100%{opacity:.2}50%{opacity:.85}}
    @keyframes dash{to{stroke-dashoffset:-500}}
  </style>
</defs>
<rect width="1200" height="420" rx="24" fill="url(#bg)"/>
<circle cx="600" cy="205" r="380" fill="url(#pulse)"><animate attributeName="r" values="300;430;300" dur="7s" repeatCount="indefinite"/></circle>
<rect width="1200" height="420" fill="url(#grid)" opacity=".8"/>
<g stroke="#00d9ff" stroke-width="1" opacity=".22"><path d="M0 80H1200M0 340H1200M90 0V420M1110 0V420" stroke-dasharray="5 12"><animate attributeName="stroke-dashoffset" from="0" to="-170" dur="9s" repeatCount="indefinite"/></path></g>
<g fill="none" stroke="url(#neon)" stroke-width="2" opacity=".9"><path d="M-100 70H1300M-100 350H1300" stroke-dasharray="100 180"><animate attributeName="stroke-dashoffset" from="0" to="-560" dur="5s" repeatCount="indefinite"/></path></g>
<path d="M70 48H270M930 48H1130M70 372H330M870 372H1130" stroke="#00e5ff" stroke-width="2" opacity=".75"/>
<text x="72" y="34" class="micro">J.A // DIGITAL BUILDER</text>
<text x="1128" y="34" class="micro" text-anchor="end">SIGNAL ACTIVE // 2026</text>
<g clip-path="url(#titleClip)" filter="url(#glow)">
  <text x="600" y="205" text-anchor="middle" class="main cyan">JOSHUA ARAO</text>
  <text x="600" y="205" text-anchor="middle" class="main pink">JOSHUA ARAO</text>
  <text x="600" y="205" text-anchor="middle" class="main mainText">JOSHUA ARAO</text>
</g>
<path d="M180 235H1020" stroke="url(#neon)" stroke-width="3"><animate attributeName="opacity" values=".25;1;.25" dur="2s" repeatCount="indefinite"/></path>
<text x="600" y="285" text-anchor="middle" class="sub">COMPUTER SCIENCE STUDENT // CREATIVE BUILDER</text>
<text x="600" y="326" text-anchor="middle" class="micro">BUILD  •  LEARN  •  EXPLORE  •  IMPROVE</text>
<text x="70" y="402" class="tiny">[ JOSHUA.A / PORTFOLIO_NODE ]</text>
<text x="1130" y="402" class="tiny" text-anchor="end">[ END OF TRANSMISSION ]</text>
<g fill="#00e5ff">
  <circle cx="100" cy="170" r="3"><animate attributeName="cy" values="170;240;170" dur="3s" repeatCount="indefinite"/><animate attributeName="opacity" values=".2;1;.2" dur="1.4s" repeatCount="indefinite"/></circle>
  <circle cx="1100" cy="260" r="4"><animate attributeName="cy" values="260;150;260" dur="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;.2;1" dur="1.8s" repeatCount="indefinite"/></circle>
  <circle cx="310" cy="90" r="2"><animate attributeName="opacity" values=".1;1;.1" dur="2s" repeatCount="indefinite"/></circle>
  <circle cx="890" cy="330" r="2"><animate attributeName="opacity" values="1;.1;1" dur="2.5s" repeatCount="indefinite"/></circle>
</g>
<g opacity=".3" fill="#ff3b9d"><rect x="0" y="0" width="1200" height="2"><animate attributeName="y" values="-2;420" dur="5s" repeatCount="indefinite"/></rect></g>
<rect x="0" y="0" width="1200" height="34" fill="#00d9ff" opacity=".035"><animate attributeName="y" values="-34;420" dur="6s" repeatCount="indefinite"/></rect>
<rect x="0" y="0" width="1200" height="420" fill="none" stroke="#244d70" stroke-width="2" rx="24"/>
</svg>